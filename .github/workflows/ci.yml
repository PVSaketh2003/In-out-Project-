name: CI Quality & Test Gatekeeper

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Quality, Migrations & Unit/Integration Tests
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Pytest & Django Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ensure Model & Directory Assets
        run: |
          mkdir -p backend/models backend/media/uploads backend/data
          python backend/models/setup_model.py backend/models/yolo26n.onnx

      - name: Validate Django Configuration & Migrations
        run: |
          cd backend
          python manage.py check
          python manage.py migrate --noinput

      - name: Run Pytest Test Suite
        run: |
          cd backend
          python -m pytest tests/ -v --color=yes --tb=short

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Build Validation & Asset Integrity
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend SPA Vite Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Build Frontend SPA
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Production Docker Container Build Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Universal Docker Build Verification
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image (Dry-Run Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: visioneye:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 4: Desktop Packaging Validation
  # ----------------------------------------------------------------------------
  desktop-validation:
    name: Desktop Packaging Validation
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Build Frontend Dist for Desktop Staging
        run: |
          cd frontend
          npm ci --prefer-offline
          npm run build
          mkdir -p ../desktop/dist-frontend
          cp -r dist/* ../desktop/dist-frontend/

      - name: Test Desktop App Packaging Dry-Run
        run: |
          cd desktop
          npm ci || npm install
          npx electron-builder --linux --dir

  # ----------------------------------------------------------------------------
  # Job 5: Automated Azure CD Deployment (Runs on main after all tests pass)
  # ----------------------------------------------------------------------------
  azure-cd-deploy:
    name: Azure Production CD Deploy
    needs: [backend-test, frontend-build, docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Azure VM (If SSH Secrets Configured)
        env:
          AZURE_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_USER: ${{ secrets.AZURE_USER || 'azureuser' }}
        run: |
          if [ -z "$AZURE_HOST" ] || [ -z "$AZURE_KEY" ]; then
            echo "Notice: Azure deployment secrets (AZURE_VM_HOST, AZURE_SSH_KEY) not set in repository secrets."
            echo "Skipping automated CD step. Direct SSH deployment via quick_deploy.sh remains active."
            exit 0
          fi
          echo "Setting up SSH key for automated Azure deployment..."
          mkdir -p ~/.ssh
          echo "$AZURE_KEY" > ~/.ssh/azure_deploy_key
          chmod 600 ~/.ssh/azure_deploy_key
          bash azure/quick_deploy.sh ~/.ssh/azure_deploy_key "$AZURE_HOST"

