events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream VisionEye ASGI Daphne backend
    upstream backend_nodes {
        server visioneye-backend:8000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Main HTTP Server on Port 80 (Accessible directly via IP or Domain)
    # --------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        client_max_body_size 200M;

        # 1. ACME challenge for Certbot SSL renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 2. Real-Time WebSocket Streaming (/ws/)
        location /ws/ {
            proxy_pass http://backend_nodes/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. MJPEG Video Stream Feed (/api/video/feed) - Disable Buffering
        location /api/video/feed {
            proxy_pass http://backend_nodes/api/video/feed;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # 4. REST API Endpoints (/api/)
        location /api/ {
            proxy_pass http://backend_nodes/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Direct Downloads Folder (/downloads/)
        location /downloads/ {
            alias /var/www/downloads/;
            autoindex on;
            add_header Content-Disposition 'attachment';
        }

        # 6. Static files for website (js, css, png, etc.)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/website;
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # 7. Live Interactive Dashboard App (/live or /app)
        location = /live {
            proxy_pass http://backend_nodes/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /live/ {
            proxy_pass http://backend_nodes/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /app {
            proxy_pass http://backend_nodes/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /app/ {
            proxy_pass http://backend_nodes/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 8. Download & Product Showcase Website Portal (Root /)
        location / {
            root /var/www/website;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
