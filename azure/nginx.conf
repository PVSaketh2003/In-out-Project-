events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom MIME Types
    types {
        application/manifest+json webmanifest;
        application/javascript js;
        text/css css;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    types_hash_max_size 2048;

    # Gzip Compression for Ultra-Fast Mobile & Web Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json application/rss+xml application/atom+xml image/svg+xml;

    # Upstream VisionEye ASGI Daphne backend container
    upstream backend_nodes {
        server visioneye-backend:8000;
        keepalive 64;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP Server on Port 80 (Redirects to HTTPS + Handles ACME Challenges)
    # --------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name pvsairamsaketh.in www.pvsairamsaketh.in _;

        client_max_body_size 200M;

        # ACME challenge for Certbot SSL renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all standard HTTP requests to HTTPS
        location / {
            # If request is from internal healthcheck or certbot, allow HTTP
            if ($http_user_agent ~* (curl|healthcheck)) {
                # Fallback to direct handling if needed
            }
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS Secure Server on Port 443 (Full SSL/TLS + WebSockets + MJPEG)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name pvsairamsaketh.in www.pvsairamsaketh.in _;

        client_max_body_size 200M;

        # SSL Certificates (Let's Encrypt / Fallback Self-Signed)
        ssl_certificate     /etc/letsencrypt/live/pvsairamsaketh.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pvsairamsaketh.in/privkey.pem;

        # Modern High-Security TLS Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Real-Time Low-Latency WebSocket Streaming (/ws/)
        location /ws/ {
            proxy_pass http://backend_nodes/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. MJPEG Video Stream Feed (/api/video/feed) - High Efficiency, No Buffering
        location /api/video/feed {
            proxy_pass http://backend_nodes/api/video/feed;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        # 3. REST API Endpoints (/api/)
        location /api/ {
            proxy_pass http://backend_nodes/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 4. Direct Downloads Folder (/downloads/)
        location /downloads/ {
            alias /var/www/downloads/;
            autoindex on;
            add_header Content-Disposition 'attachment';
        }

        # 5. Live Interactive Dashboard App (/live or /app)
        location ~ ^/(live|app)(/.*)?$ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 6. Built React SPA Assets (/assets/)
        location /assets/ {
            proxy_pass http://backend_nodes/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
        }

        # 7. PWA Manifest and Service Worker Assets
        location ~ ^/(manifest\.webmanifest|manifest\.json|sw\.js|favicon\.ico)$ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            expires 1d;
        }

        # 8. Download & Product Showcase Website Portal (Root /)
        location / {
            root /var/www/website;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
