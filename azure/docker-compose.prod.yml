version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # VisionEye Core Application Container (Backend ASGI + Frontend Static Dist)
  # ----------------------------------------------------------------------------
  visioneye-backend:
    image: ${DOCKER_IMAGE:-pvsairamsaketh/visioneye:latest}
    container_name: visioneye-app
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=${DJANGO_SECRET_KEY:-super-secure-production-key-for-visioneye-app}
      - ALLOWED_HOSTS=pvsairamsaketh.in,www.pvsairamsaketh.in,localhost,127.0.0.1,${AZURE_VM_IP:-127.0.0.1}
      - CORS_ALLOWED_ORIGINS=https://pvsairamsaketh.in,https://www.pvsairamsaketh.in,http://localhost:5173
      - MODEL_PATH=/app/backend/models/yolo26n.onnx
      - CONFIDENCE_THRESHOLD=0.40
    volumes:
      - visioneye_media:/app/backend/media
      - visioneye_data:/app/backend/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - visioneye-net

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy with SSL (Let's Encrypt), WebSockets & MJPEG streaming
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: visioneye-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - visioneye_certbot_www:/var/www/certbot:ro
    depends_on:
      - visioneye-backend
    networks:
      - visioneye-net

volumes:
  visioneye_media:
  visioneye_data:
  visioneye_certbot_www:

networks:
  visioneye-net:
    driver: bridge
